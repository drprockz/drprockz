<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 372" width="410" height="372" font-size="12" role="img" aria-labelledby="t d">
<title id="t">AFK</title><desc id="d">AFK: the permission layer that lets Claude Code keep working while you step away. Learns your approve and deny patterns, auto-approves safe actions, queues destructive ones for review, takes a git checkpoint before anything risky, lets you approve from your phone, and has a local dashboard. Open source, MIT.</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;fill:#15181D}
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.b{font-weight:700}
.ink{fill:#15181D}.mut{fill:#565E6A}.fnt{fill:#7C838E}.ag{fill:#0B8F7D}.hu{fill:#CF521A}.st{fill:#C4374A}
.lbl{font-size:10.5px;letter-spacing:.14em;fill:#7C838E}
.box{fill:#F3F1EA;stroke:#DCD8CD}
.ln{stroke:#DCD8CD;fill:none}
.sag{stroke:#0B8F7D;fill:none}.shu{stroke:#CF521A;fill:none}
.flow{stroke-dasharray:3 7;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.ti{font-size:27px;font-weight:800;letter-spacing:-.6px}.tg{font-size:12.5px}.bu{font-size:12px}</style>
<defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#E6E3DA"/></pattern></defs>
<rect x=".5" y=".5" width="409" height="371" rx="14" fill="#FCFBF8" stroke="#DCD8CD"/>
<rect x="1" y="1" width="408" height="370" rx="13" fill="url(#dots)"/>
<text x="28" y="36" class="lbl">CLAUDE CODE PLUGIN</text>
<rect x="256.5" y="21.5" width="128" height="22" rx="11" fill="rgba(11,143,125,.11)" stroke="#0B8F7D"/><text x="320" y="35.8" class="ag" font-size="10.5" text-anchor="middle">open source · MIT</text><text x="27" y="84" class="s ti ink">AFK</text><text x="28" y="110" class="mut tg">The permission layer that lets Claude Code</text><text x="28" y="128" class="mut tg">keep working while you step away.</text><path d="M30 160h7" stroke="#0B8F7D" stroke-width="1.6" stroke-linecap="round"/><text x="46" y="164" class="ink bu">learns your approve / deny patterns</text><path d="M30 182h7" stroke="#0B8F7D" stroke-width="1.6" stroke-linecap="round"/><text x="46" y="186" class="ink bu">safe actions auto-approved and logged</text><path d="M30 204h7" stroke="#0B8F7D" stroke-width="1.6" stroke-linecap="round"/><text x="46" y="208" class="ink bu">destructive ones wait in a review queue</text><path d="M30 226h7" stroke="#0B8F7D" stroke-width="1.6" stroke-linecap="round"/><text x="46" y="230" class="ink bu">git checkpoint before anything risky</text><path d="M30 248h7" stroke="#0B8F7D" stroke-width="1.6" stroke-linecap="round"/><text x="46" y="252" class="ink bu">approve from your phone: ntfy, Telegram</text><path d="M30 270h7" stroke="#0B8F7D" stroke-width="1.6" stroke-linecap="round"/><text x="46" y="274" class="ink bu">local dashboard: history, rules, queue</text><rect x="28.5" y="326.5" width="65" height="22" rx="11" fill="#F3F1EA" stroke="#DCD8CD"/><text x="60.5" y="340.8" class="mut" font-size="10.5" text-anchor="middle">Node.js</text><rect x="100.5" y="326.5" width="58" height="22" rx="11" fill="#F3F1EA" stroke="#DCD8CD"/><text x="129" y="340.8" class="mut" font-size="10.5" text-anchor="middle">SQLite</text><rect x="165.5" y="326.5" width="128" height="22" rx="11" fill="#F3F1EA" stroke="#DCD8CD"/><text x="229" y="340.8" class="mut" font-size="10.5" text-anchor="middle">Claude Code hooks</text><rect x="300.5" y="326.5" width="65" height="22" rx="11" fill="#F3F1EA" stroke="#DCD8CD"/><text x="332.5" y="340.8" class="mut" font-size="10.5" text-anchor="middle">Express</text>
</svg>
