<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 372" width="410" height="372" font-size="12" role="img" aria-labelledby="t d">
<title id="t">AFK decision chain</title><desc id="d">Seven checks in order: sensitive path (always ask), prompt injection (deny), destructive action (snapshot and defer), static rule (allow or deny), anomaly (notify and defer), behavior prediction (decide automatically at 0.85 confidence or higher), away fallback (ask by phone). Each request is decided in under 200 milliseconds.</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;fill:#E9ECEF}
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.b{font-weight:700}
.ink{fill:#E9ECEF}.mut{fill:#9AA3B0}.fnt{fill:#6B7482}.ag{fill:#34D6B9}.hu{fill:#FF8E4D}.st{fill:#F2707A}
.lbl{font-size:10.5px;letter-spacing:.14em;fill:#6B7482}
.box{fill:#12161D;stroke:#252C37}
.ln{stroke:#252C37;fill:none}
.sag{stroke:#34D6B9;fill:none}.shu{stroke:#FF8E4D;fill:none}
.flow{stroke-dasharray:3 7;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.n{font-size:12px}
.tok{fill:#34D6B9;animation:tok 10.4s ease-in-out infinite}
@keyframes tok{0%,8.8%{transform:translateY(0px);opacity:1}12.5%,21.3%{transform:translateY(36px);opacity:1}25%,33.7%{transform:translateY(72px);opacity:1}37.5%,46.3%{transform:translateY(108px);opacity:1}50%,58.8%{transform:translateY(144px);opacity:1}62.5%,71.3%{transform:translateY(180px);opacity:1}75%,83.8%{transform:translateY(216px);opacity:1}87.5%,100%{transform:translateY(216px);opacity:0}}
.hl{fill:rgba(52,214,185,.13);opacity:0;animation:hl 10.4s linear infinite}
@keyframes hl{0%{opacity:0}1%,9.4%{opacity:1}12.5%,100%{opacity:0}}</style>
<defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#1B212A"/></pattern>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34D6B9" stop-opacity=".55"/><stop offset=".3" stop-color="#252C37"/><stop offset=".7" stop-color="#252C37"/><stop offset="1" stop-color="#FF8E4D" stop-opacity=".5"/></linearGradient></defs>
<rect x=".5" y=".5" width="409" height="371" rx="14" fill="#0B0E13" stroke="url(#edge)"/>
<rect x="1" y="1" width="408" height="370" rx="13" fill="url(#dots)"/>
<text x="28" y="36" class="lbl">FIG. 02 — AFK DECISION CHAIN</text>
<path d="M44.5 82V298" class="ln"/><rect x="28" y="67" width="354" height="30" rx="8" class="hl" style="animation-delay:0.00s"/><circle cx="44.5" cy="82" r="5" fill="#0B0E13" stroke="#6B7482" stroke-width="1.3"/><text x="62" y="86" class="fnt" font-size="11">01</text><text x="88" y="86" class="ink n">sensitive path</text><rect x="294.5" y="71.5" width="82" height="22" rx="11" fill="rgba(255,142,77,.13)" stroke="#FF8E4D"/><text x="335" y="85.8" class="hu" font-size="10.5" text-anchor="middle">always ask</text><rect x="28" y="103" width="354" height="30" rx="8" class="hl" style="animation-delay:1.30s"/><circle cx="44.5" cy="118" r="5" fill="#0B0E13" stroke="#6B7482" stroke-width="1.3"/><text x="62" y="122" class="fnt" font-size="11">02</text><text x="88" y="122" class="ink n">prompt injection</text><rect x="332.5" y="107.5" width="44" height="22" rx="11" fill="none" stroke="#F2707A"/><text x="354" y="121.8" class="st" font-size="10.5" text-anchor="middle">deny</text><rect x="28" y="139" width="354" height="30" rx="8" class="hl" style="animation-delay:2.60s"/><circle cx="44.5" cy="154" r="5" fill="#0B0E13" stroke="#6B7482" stroke-width="1.3"/><text x="62" y="158" class="fnt" font-size="11">03</text><text x="88" y="158" class="ink n">destructive action</text><rect x="256.5" y="143.5" width="120" height="22" rx="11" fill="rgba(255,142,77,.13)" stroke="#FF8E4D"/><text x="316" y="157.8" class="hu" font-size="10.5" text-anchor="middle">snapshot + defer</text><rect x="28" y="175" width="354" height="30" rx="8" class="hl" style="animation-delay:3.90s"/><circle cx="44.5" cy="190" r="5" fill="#0B0E13" stroke="#6B7482" stroke-width="1.3"/><text x="62" y="194" class="fnt" font-size="11">04</text><text x="88" y="194" class="ink n">static rule</text><rect x="282.5" y="179.5" width="94" height="22" rx="11" fill="#12161D" stroke="#252C37"/><text x="329" y="193.8" class="mut" font-size="10.5" text-anchor="middle">allow / deny</text><rect x="28" y="211" width="354" height="30" rx="8" class="hl" style="animation-delay:5.20s"/><circle cx="44.5" cy="226" r="5" fill="#0B0E13" stroke="#6B7482" stroke-width="1.3"/><text x="62" y="230" class="fnt" font-size="11">05</text><text x="88" y="230" class="ink n">anomaly</text><rect x="269.5" y="215.5" width="107" height="22" rx="11" fill="rgba(255,142,77,.13)" stroke="#FF8E4D"/><text x="322.5" y="229.8" class="hu" font-size="10.5" text-anchor="middle">notify + defer</text><rect x="28" y="247" width="354" height="30" rx="8" class="hl" style="animation-delay:6.50s"/><circle cx="44.5" cy="262" r="5" fill="#0B0E13" stroke="#6B7482" stroke-width="1.3"/><text x="62" y="266" class="fnt" font-size="11">06</text><text x="88" y="266" class="ink n">behavior prediction</text><rect x="288.5" y="251.5" width="88" height="22" rx="11" fill="rgba(52,214,185,.13)" stroke="#34D6B9"/><text x="332" y="265.8" class="ag" font-size="10.5" text-anchor="middle">auto ≥ 0.85</text><rect x="28" y="283" width="354" height="30" rx="8" class="hl" style="animation-delay:7.80s"/><circle cx="44.5" cy="298" r="5" fill="#0B0E13" stroke="#6B7482" stroke-width="1.3"/><text x="62" y="302" class="fnt" font-size="11">07</text><text x="88" y="302" class="ink n">away fallback</text><rect x="282.5" y="287.5" width="94" height="22" rx="11" fill="rgba(255,142,77,.13)" stroke="#FF8E4D"/><text x="329" y="301.8" class="hu" font-size="10.5" text-anchor="middle">ask by phone</text><circle cx="44.5" cy="82" r="3" class="tok"/><path d="M28 326.5H382" class="ln"/><text x="28" y="350" class="mut" font-size="11.5">every permission request · under 200 ms</text>
</svg>
