<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 572" width="880" height="572" font-size="12" role="img" aria-labelledby="t d">
<title id="t">CRUZ architecture</title><desc id="d">Voice, web and Telegram input reach CruzAgent, which uses Claude native tool use as the router to twelve specialist agents. Deploys and emails pass a human approval gate. Five event-driven agents run from a Redis-backed worker. Memory has four layers: working, session, semantic and procedural. Models are routed between Claude Sonnet, local Qwen and Llama, and Gemini Flash.</desc>
