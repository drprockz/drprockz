<rect x=".5" y=".5" width="409" height="299" rx="14" fill="#FCFBF8" stroke="url(#edge)"/>
<rect x="1" y="1" width="408" height="298" rx="13" fill="url(#dots)"/>
<text x="28" y="36" class="lbl">CRUZ · BY THE NUMBERS</text>
<text x="27" y="100" class="s big ag">12</text><text x="28" y="124" class="ink c1">on-demand specialists</text><text x="28" y="141" class="mut c2">invoked in parallel</text><text x="211" y="100" class="s big ag">5</text><text x="212" y="124" class="ink c1">event-driven agents</text><text x="212" y="141" class="mut c2">cron + webhooks</text><text x="27" y="204" class="s big ag">1,200+</text><text x="28" y="228" class="ink c1">tests in the suite</text><text x="28" y="245" class="mut c2">agents · api · services</text><text x="211" y="204" class="s big ag">4</text><text x="212" y="228" class="ink c1">memory layers</text><text x="212" y="245" class="mut c2">context to vectors</text><path d="M28 254.5H382" class="ln"/><text x="28" y="277" class="mut" font-size="11.5">Python · FastAPI · Postgres · Redis · Qdrant</text>
