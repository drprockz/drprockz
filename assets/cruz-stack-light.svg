<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 648" width="880" height="648" font-size="12" role="img" aria-labelledby="t d">
<title id="t">CRUZ, exploded view</title><desc id="d">Four stacked layers. Interface: voice with wake word, web and PWA, Telegram. Router: CruzAgent, where Claude's tool call is the routing decision. Specialists: twelve agents called as tools in parallel, plus five event-driven agents; deploys and email wait for a human. Memory: four layers, working, session, semantic and procedural.</desc>
