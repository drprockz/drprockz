<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 300" width="410" height="300" font-size="12" role="img" aria-labelledby="t d">
<title id="t">A CRUZ session</title><desc id="d">User: the client site is broken in prod. Sentinel finds a failing null check, Forge patches it, QT reports 12 of 12 tests passing. CRUZ pauses for approval before deploying. After the user says yes, Titan deploys with rollback armed and Echo drafts a client update for review.</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;fill:#E9ECEF}
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.b{font-weight:700}
.ink{fill:#E9ECEF}.mut{fill:#9AA3B0}.fnt{fill:#6B7482}.ag{fill:#34D6B9}.hu{fill:#FF8E4D}.st{fill:#F2707A}
.lbl{font-size:10.5px;letter-spacing:.14em;fill:#6B7482}
.box{fill:#12161D;stroke:#252C37}
.ln{stroke:#252C37;fill:none}
.sag{stroke:#34D6B9;fill:none}.shu{stroke:#FF8E4D;fill:none}
.flow{stroke-dasharray:3 7;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.l{font-size:12px;animation-duration:16s;animation-iteration-count:infinite;animation-timing-function:step-end}
.cur{animation:cur 1s step-end infinite}@keyframes cur{50%{opacity:0}}@keyframes l0{0%{opacity:1}97%{opacity:0}100%{opacity:0}}@keyframes l1{0%{opacity:0}8%{opacity:1}97%{opacity:0}100%{opacity:0}}@keyframes l2{0%{opacity:0}16%{opacity:1}97%{opacity:0}100%{opacity:0}}@keyframes l3{0%{opacity:0}24%{opacity:1}97%{opacity:0}100%{opacity:0}}@keyframes l4{0%{opacity:0}34%{opacity:1}97%{opacity:0}100%{opacity:0}}@keyframes l5{0%{opacity:0}48%{opacity:1}97%{opacity:0}100%{opacity:0}}@keyframes l6{0%{opacity:0}56%{opacity:1}97%{opacity:0}100%{opacity:0}}@keyframes l7{0%{opacity:0}64%{opacity:1}97%{opacity:0}100%{opacity:0}}</style>
<defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#1B212A"/></pattern></defs>
<rect x=".5" y=".5" width="409" height="299" rx="14" fill="#0B0E13" stroke="#252C37"/>
<rect x="1" y="1" width="408" height="298" rx="13" fill="url(#dots)"/>

<path d="M1 46.5H409" class="ln"/><circle cx="30" cy="24" r="4.5" fill="#252C37"/><circle cx="46" cy="24" r="4.5" fill="#252C37"/><circle cx="62" cy="24" r="4.5" fill="#252C37"/><text x="205" y="28" class="fnt" font-size="11.5" text-anchor="middle">cruz — session</text><text x="28" y="78" class="l" xml:space="preserve" style="animation-name:l0"><tspan class="ag b">❯ </tspan><tspan class="ink b">the client site is broken in prod</tspan></text><text x="28" y="104" class="l" xml:space="preserve" style="animation-name:l1"><tspan class="ag">  sentinel  </tspan><tspan class="mut">null check fails · orders.js:84</tspan></text><text x="28" y="130" class="l" xml:space="preserve" style="animation-name:l2"><tspan class="ag">  forge     </tspan><tspan class="mut">patched · 1 file changed</tspan></text><text x="28" y="156" class="l" xml:space="preserve" style="animation-name:l3"><tspan class="ag">  qt        </tspan><tspan class="mut">12/12 tests passing</tspan></text><rect x="16.5" y="165.5" width="377" height="25" rx="6" fill="rgba(255,142,77,.13)" stroke="#FF8E4D" class="l" style="animation-name:l4"/><text x="28" y="182" class="l" xml:space="preserve" style="animation-name:l4"><tspan class="hu b">Ⅱ approval required — deploy to prod?</tspan></text><text x="28" y="208" class="l" xml:space="preserve" style="animation-name:l5"><tspan class="ag b">❯ </tspan><tspan class="ink b">yes</tspan></text><text x="28" y="234" class="l" xml:space="preserve" style="animation-name:l6"><tspan class="ag">  titan     </tspan><tspan class="mut">deployed · rollback armed</tspan></text><text x="28" y="260" class="l" xml:space="preserve" style="animation-name:l7"><tspan class="ag">  echo      </tspan><tspan class="mut">client update drafted for review</tspan></text><rect x="28" y="275" width="7" height="13" fill="#34D6B9" class="cur"/>
</svg>
