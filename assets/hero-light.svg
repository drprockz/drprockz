<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-size="12" role="img" aria-labelledby="t d">
<title id="t">Darshan Parmar — AI Engineer</title><desc id="d">I build AI agents that keep working while you are away, and stop to ask before anything irreversible. Diagram: a router dispatching work to code, review, test, deploy, email and research agents; deploy and email wait at a human approval gate.</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;fill:#15181D}
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.b{font-weight:700}
.ink{fill:#15181D}.mut{fill:#565E6A}.fnt{fill:#7C838E}.ag{fill:#0B8F7D}.hu{fill:#CF521A}.st{fill:#C4374A}
.lbl{font-size:10.5px;letter-spacing:.14em;fill:#7C838E}
.box{fill:#F3F1EA;stroke:#DCD8CD}
.ln{stroke:#DCD8CD;fill:none}
.sag{stroke:#0B8F7D;fill:none}.shu{stroke:#CF521A;fill:none}
.flow{stroke-dasharray:3 7;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.name{font-size:58px;font-weight:800;letter-spacing:-1.6px}
.role{font-size:17px}.tag{font-size:14px}
.blink{animation:blink 2.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.orbit{stroke:#7C838E;opacity:.55;fill:none;stroke-dasharray:2 9;animation:orbit 40s linear infinite}
@keyframes orbit{to{stroke-dashoffset:-220}}
.hubring{fill:none;stroke:#0B8F7D;transform-box:fill-box;transform-origin:center;animation:hub 3s ease-out infinite}
@keyframes hub{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.45)}}
.pulse{fill:#0B8F7D;opacity:0;animation-duration:9s;animation-iteration-count:infinite;animation-timing-function:linear}
.ping{fill:none;stroke:#0B8F7D;opacity:0;transform-box:fill-box;transform-origin:center;animation-duration:9s;animation-iteration-count:infinite}
.lit{fill:#0B8F7D;opacity:0;animation-duration:9s;animation-iteration-count:infinite}
.gate{fill:#FCFBF8;stroke:#CF521A;stroke-width:1.6;stroke-dasharray:52;animation-duration:9s;animation-iteration-count:infinite;animation-timing-function:linear}
@keyframes ping{0%,22%{opacity:0;transform:scale(1)}24%{opacity:.9}42%,100%{opacity:0;transform:scale(2.6)}}
@keyframes lit{0%,21%{opacity:0}24%,40%{opacity:1}52%,100%{opacity:0}}
@keyframes gping{0%,58%{opacity:0;transform:scale(1)}60%{opacity:.9}78%,100%{opacity:0;transform:scale(2.6)}}
@keyframes glit{0%,57%{opacity:0}60%,76%{opacity:1}88%,100%{opacity:0}}
@keyframes gate{0%,11%{stroke-dashoffset:52}44%,100%{stroke-dashoffset:0}}
@keyframes mv0{0%{transform:translate(0,0);opacity:0}3%{opacity:1}21%{transform:translate(0px,-76px);opacity:1}25%,100%{transform:translate(0px,-76px);opacity:0}}@keyframes mv1{0%{transform:translate(0,0);opacity:0}3%{opacity:1}21%{transform:translate(65.8px,-38px);opacity:1}25%,100%{transform:translate(65.8px,-38px);opacity:0}}@keyframes mv2{0%{transform:translate(0,0);opacity:0}3%{opacity:1}21%{transform:translate(65.8px,38px);opacity:1}25%,100%{transform:translate(65.8px,38px);opacity:0}}@keyframes mv3{0%{transform:translate(0,0);opacity:0}3%{opacity:1}11%,46%{transform:translate(0px,38px);opacity:1}57%{transform:translate(0px,76px);opacity:1}61%,100%{transform:translate(0px,76px);opacity:0}}@keyframes mv4{0%{transform:translate(0,0);opacity:0}3%{opacity:1}11%,46%{transform:translate(-32.9px,19px);opacity:1}57%{transform:translate(-65.8px,38px);opacity:1}61%,100%{transform:translate(-65.8px,38px);opacity:0}}@keyframes mv5{0%{transform:translate(0,0);opacity:0}3%{opacity:1}21%{transform:translate(-65.8px,-38px);opacity:1}25%,100%{transform:translate(-65.8px,-38px);opacity:0}}</style>
<defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#E6E3DA"/></pattern><radialGradient id="glow"><stop offset="0" stop-color="#0B8F7D" stop-opacity=".10"/><stop offset="1" stop-color="#0B8F7D" stop-opacity="0"/></radialGradient></defs>
<rect x=".5" y=".5" width="879" height="399" rx="14" fill="#FCFBF8" stroke="#DCD8CD"/>
<rect x="1" y="1" width="878" height="398" rx="13" fill="url(#dots)"/>


<circle cx="690" cy="204" r="200" fill="url(#glow)"/>
<circle cx="52" cy="39.5" r="4" fill="#0B8F7D" class="blink"/>
<text x="66" y="44" font-size="12.5"><tspan class="ink b">drprockz</tspan><tspan class="fnt" letter-spacing=".14em" dx="10">AI ENGINEER / MUMBAI, IN</tspan></text>
<text x="46" y="164" class="s name ink">Darshan Parmar</text>
<text x="48" y="204" class="role"><tspan class="ag b">AI Engineer</tspan><tspan class="mut"> — agents, MCP, full-stack</tspan></text>
<text x="48" y="262" class="tag mut">I build AI agents that keep working while you’re away</text>
<text x="48" y="285" class="tag mut">— and <tspan class="hu b">stop to ask</tspan> before anything irreversible.</text>
<circle cx="52" cy="349" r="4" fill="#0B8F7D"/><text x="66" y="353" class="mut" font-size="12">runs on its own</text>
<circle cx="213" cy="349" r="5" fill="none" stroke="#CF521A" stroke-width="1.6"/><text x="227" y="353" class="mut" font-size="12">waits for a human</text>
<circle cx="690" cy="204" r="112" class="orbit"/><circle cx="690" cy="204" r="146" class="orbit" style="opacity:.3"/><line x1="690" y1="168" x2="690" y2="92" class="ln"/><circle cx="690" cy="168" r="3.2" class="pulse" style="animation-name:mv0;animation-delay:0s"/><line x1="721.2" y1="186" x2="787" y2="148" class="ln"/><circle cx="721.2" cy="186" r="3.2" class="pulse" style="animation-name:mv1;animation-delay:1.4s"/><line x1="721.2" y1="222" x2="787" y2="260" class="ln"/><circle cx="721.2" cy="222" r="3.2" class="pulse" style="animation-name:mv2;animation-delay:2.7s"/><line x1="690" y1="240" x2="690" y2="316" class="ln"/><circle cx="690" cy="240" r="3.2" class="pulse" style="animation-name:mv3;animation-delay:4.1s"/><line x1="658.8" y1="222" x2="593" y2="260" class="ln"/><circle cx="658.8" cy="222" r="3.2" class="pulse" style="animation-name:mv4;animation-delay:5.4s"/><line x1="658.8" y1="186" x2="593" y2="148" class="ln"/><circle cx="658.8" cy="186" r="3.2" class="pulse" style="animation-name:mv5;animation-delay:6.8s"/><circle cx="690" cy="204" r="36" class="hubring"/>
<circle cx="690" cy="204" r="36" fill="#FCFBF8" stroke="#0B8F7D" stroke-width="1.6"/>
<circle cx="690" cy="204" r="29" fill="rgba(11,143,125,.11)"/>
<text x="690" y="208.5" class="ink b" font-size="12.5" text-anchor="middle">router</text><circle cx="690" cy="92" r="6" class="ping" style="animation-name:ping;animation-delay:0s"/><circle cx="690" cy="92" r="6" fill="#FCFBF8" stroke="#0B8F7D" stroke-width="1.5"/><circle cx="690" cy="92" r="3.4" class="lit" style="animation-name:lit;animation-delay:0s"/><text x="690" y="68" class="mut" font-size="12" text-anchor="middle">code</text><circle cx="787" cy="148" r="6" class="ping" style="animation-name:ping;animation-delay:1.4s"/><circle cx="787" cy="148" r="6" fill="#FCFBF8" stroke="#0B8F7D" stroke-width="1.5"/><circle cx="787" cy="148" r="3.4" class="lit" style="animation-name:lit;animation-delay:1.4s"/><text x="806" y="141" class="mut" font-size="12" text-anchor="start">review</text><circle cx="787" cy="260" r="6" class="ping" style="animation-name:ping;animation-delay:2.7s"/><circle cx="787" cy="260" r="6" fill="#FCFBF8" stroke="#0B8F7D" stroke-width="1.5"/><circle cx="787" cy="260" r="3.4" class="lit" style="animation-name:lit;animation-delay:2.7s"/><text x="806" y="275" class="mut" font-size="12" text-anchor="start">test</text><circle cx="690" cy="278" r="8.2" class="gate" style="animation-name:gate;animation-delay:4.1s" transform="rotate(-90 690 278)"/><path d="M687.6 274.8v6.4M692.4 274.8v6.4" stroke="#CF521A" stroke-width="1.7" stroke-linecap="round"/><circle cx="690" cy="316" r="6" class="ping" style="animation-name:gping;animation-delay:4.1s"/><circle cx="690" cy="316" r="6" fill="#FCFBF8" stroke="#CF521A" stroke-width="1.5"/><circle cx="690" cy="316" r="3.4" class="lit" style="animation-name:glit;animation-delay:4.1s"/><text x="690" y="348" class="mut" font-size="12" text-anchor="middle">deploy</text><circle cx="625.9" cy="241" r="8.2" class="gate" style="animation-name:gate;animation-delay:5.4s" transform="rotate(-90 625.9 241)"/><path d="M623.5 237.8v6.4M628.3 237.8v6.4" stroke="#CF521A" stroke-width="1.7" stroke-linecap="round"/><circle cx="593" cy="260" r="6" class="ping" style="animation-name:gping;animation-delay:5.4s"/><circle cx="593" cy="260" r="6" fill="#FCFBF8" stroke="#CF521A" stroke-width="1.5"/><circle cx="593" cy="260" r="3.4" class="lit" style="animation-name:glit;animation-delay:5.4s"/><text x="574" y="275" class="mut" font-size="12" text-anchor="end">email</text><circle cx="593" cy="148" r="6" class="ping" style="animation-name:ping;animation-delay:6.8s"/><circle cx="593" cy="148" r="6" fill="#FCFBF8" stroke="#0B8F7D" stroke-width="1.5"/><circle cx="593" cy="148" r="3.4" class="lit" style="animation-name:lit;animation-delay:6.8s"/><text x="574" y="141" class="mut" font-size="12" text-anchor="end">research</text>
</svg>
