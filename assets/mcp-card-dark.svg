<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 318" width="410" height="318" font-size="12" role="img" aria-labelledby="t d">
<title id="t">Shooterista MCP</title><desc id="d">Shooterista MCP: a read-only MCP server that lets Claude answer questions about a live multi-tenant club-management SaaS. 32 typed tools over GraphQL, local stdio and hosted HTTP modes, OAuth with dynamic client registration and PKCE, no personal data requested, paced and cached calls. Private repository.</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;fill:#E9ECEF}
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.b{font-weight:700}
.ink{fill:#E9ECEF}.mut{fill:#9AA3B0}.fnt{fill:#6B7482}.ag{fill:#34D6B9}.hu{fill:#FF8E4D}.st{fill:#F2707A}
.lbl{font-size:10.5px;letter-spacing:.14em;fill:#6B7482}
.box{fill:#12161D;stroke:#252C37}
.ln{stroke:#252C37;fill:none}
.sag{stroke:#34D6B9;fill:none}.shu{stroke:#FF8E4D;fill:none}
.flow{stroke-dasharray:3 7;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.ti{font-size:27px;font-weight:800;letter-spacing:-.6px}.tg{font-size:12.5px}.bu{font-size:12px}</style>
<defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#1B212A"/></pattern></defs>
<rect x=".5" y=".5" width="409" height="317" rx="14" fill="#0B0E13" stroke="#252C37"/>
<rect x="1" y="1" width="408" height="316" rx="13" fill="url(#dots)"/>
<text x="28" y="36" class="lbl">MCP SERVER</text>
<rect x="319.5" y="21.5" width="65" height="22" rx="11" fill="#12161D" stroke="#252C37"/><text x="351.5" y="35.8" class="mut" font-size="10.5" text-anchor="middle">private</text><text x="27" y="84" class="s ti ink">Shooterista MCP</text><text x="28" y="110" class="mut tg">Lets Claude answer questions about a live,</text><text x="28" y="128" class="mut tg">multi-tenant club-management SaaS.</text><path d="M30 160h7" stroke="#34D6B9" stroke-width="1.6" stroke-linecap="round"/><text x="46" y="164" class="ink bu">32 typed, read-only tools over GraphQL</text><path d="M30 182h7" stroke="#34D6B9" stroke-width="1.6" stroke-linecap="round"/><text x="46" y="186" class="ink bu">local stdio + hosted HTTP connector</text><path d="M30 204h7" stroke="#34D6B9" stroke-width="1.6" stroke-linecap="round"/><text x="46" y="208" class="ink bu">OAuth with DCR + PKCE, per-user login</text><path d="M30 226h7" stroke="#34D6B9" stroke-width="1.6" stroke-linecap="round"/><text x="46" y="230" class="ink bu">personal data is never requested</text><path d="M30 248h7" stroke="#34D6B9" stroke-width="1.6" stroke-linecap="round"/><text x="46" y="252" class="ink bu">paced, cached, deadline-bound calls</text><rect x="28.5" y="272.5" width="84" height="22" rx="11" fill="#12161D" stroke="#252C37"/><text x="70" y="286.8" class="mut" font-size="10.5" text-anchor="middle">TypeScript</text><rect x="119.5" y="272.5" width="65" height="22" rx="11" fill="#12161D" stroke="#252C37"/><text x="151.5" y="286.8" class="mut" font-size="10.5" text-anchor="middle">MCP SDK</text><rect x="191.5" y="272.5" width="39" height="22" rx="11" fill="#12161D" stroke="#252C37"/><text x="210.5" y="286.8" class="mut" font-size="10.5" text-anchor="middle">zod</text><rect x="237.5" y="272.5" width="58" height="22" rx="11" fill="#12161D" stroke="#252C37"/><text x="266" y="286.8" class="mut" font-size="10.5" text-anchor="middle">Docker</text>
</svg>
