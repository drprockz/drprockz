<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 318" width="410" height="318" font-size="12" role="img" aria-labelledby="t d">
<title id="t">Shooterista MCP</title><desc id="d">Shooterista MCP: a read-only MCP server that lets Claude answer questions about a live multi-tenant club-management SaaS. 32 typed tools over GraphQL, local stdio and hosted HTTP modes, OAuth with dynamic client registration and PKCE, no personal data requested, paced and cached calls. Private repository.</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;fill:#15181D}
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.b{font-weight:700}
.ink{fill:#15181D}.mut{fill:#565E6A}.fnt{fill:#7C838E}.ag{fill:#0B8F7D}.hu{fill:#CF521A}.st{fill:#C4374A}
.lbl{font-size:10.5px;letter-spacing:.14em;fill:#7C838E}
.box{fill:#F3F1EA;stroke:#DCD8CD}
.ln{stroke:#DCD8CD;fill:none}
.sag{stroke:#0B8F7D;fill:none}.shu{stroke:#CF521A;fill:none}
.flow{stroke-dasharray:3 7;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.ti{font-size:27px;font-weight:800;letter-spacing:-.6px}.tg{font-size:12.5px}.bu{font-size:12px}</style>
<defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#E6E3DA"/></pattern>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B8F7D" stop-opacity=".55"/><stop offset=".3" stop-color="#DCD8CD"/><stop offset=".7" stop-color="#DCD8CD"/><stop offset="1" stop-color="#CF521A" stop-opacity=".5"/></linearGradient></defs>
<rect x=".5" y=".5" width="409" height="317" rx="14" fill="#FCFBF8" stroke="url(#edge)"/>
<rect x="1" y="1" width="408" height="316" rx="13" fill="url(#dots)"/>
<text x="28" y="36" class="lbl">MCP SERVER</text>
<rect x="319.5" y="21.5" width="65" height="22" rx="11" fill="#F3F1EA" stroke="#DCD8CD"/><text x="351.5" y="35.8" class="mut" font-size="10.5" text-anchor="middle">private</text><ellipse cx="346" cy="98" rx="34" ry="6" fill="#DCD8CD" opacity=".7"/><path d="M370.7487373415292 80.28842904023183L321.25126265847086 80.28842904023185" stroke="#0B8F7D" stroke-width="2.4" class="flow" stroke-dasharray="3 4"/><path d="M357.9 72.9L372.7 81.4L372.7 98.6L357.9 90Z" fill="#DEDAD0" stroke="#DCD8CD" stroke-width=".7" stroke-linejoin="round"/><path d="M387.6 72.9L372.7 81.4L372.7 98.6L387.6 90Z" fill="#CEC9BC" stroke="#DCD8CD" stroke-width=".7" stroke-linejoin="round"/><path d="M372.7 64.3L387.6 72.9L372.7 81.4L357.9 72.9Z" fill="#F4F2EB" stroke="#DCD8CD" stroke-width=".7" stroke-linejoin="round"/><path d="M304.4 72.9L319.3 81.4L319.3 98.6L304.4 90Z" fill="#0B8F7D"/><path d="M334.1 72.9L319.3 81.4L319.3 98.6L334.1 90Z" fill="#08705F"/><path d="M319.3 64.3L334.1 72.9L319.3 81.4L304.4 72.9Z" fill="#58D3C1"/><text x="27" y="84" class="s ti ink">Shooterista MCP</text><text x="28" y="110" class="mut tg">Lets Claude answer questions about</text><text x="28" y="128" class="mut tg">a live, multi-tenant club-management SaaS.</text><path d="M30 160h7" stroke="#0B8F7D" stroke-width="1.6" stroke-linecap="round"/><text x="46" y="164" class="ink bu">32 typed, read-only tools over GraphQL</text><path d="M30 182h7" stroke="#0B8F7D" stroke-width="1.6" stroke-linecap="round"/><text x="46" y="186" class="ink bu">local stdio + hosted HTTP connector</text><path d="M30 204h7" stroke="#0B8F7D" stroke-width="1.6" stroke-linecap="round"/><text x="46" y="208" class="ink bu">OAuth with DCR + PKCE, per-user login</text><path d="M30 226h7" stroke="#0B8F7D" stroke-width="1.6" stroke-linecap="round"/><text x="46" y="230" class="ink bu">personal data is never requested</text><path d="M30 248h7" stroke="#0B8F7D" stroke-width="1.6" stroke-linecap="round"/><text x="46" y="252" class="ink bu">paced, cached, deadline-bound calls</text><rect x="28.5" y="272.5" width="84" height="22" rx="11" fill="#F3F1EA" stroke="#DCD8CD"/><text x="70" y="286.8" class="mut" font-size="10.5" text-anchor="middle">TypeScript</text><rect x="119.5" y="272.5" width="65" height="22" rx="11" fill="#F3F1EA" stroke="#DCD8CD"/><text x="151.5" y="286.8" class="mut" font-size="10.5" text-anchor="middle">MCP SDK</text><rect x="191.5" y="272.5" width="39" height="22" rx="11" fill="#F3F1EA" stroke="#DCD8CD"/><text x="210.5" y="286.8" class="mut" font-size="10.5" text-anchor="middle">zod</text><rect x="237.5" y="272.5" width="58" height="22" rx="11" fill="#F3F1EA" stroke="#DCD8CD"/><text x="266" y="286.8" class="mut" font-size="10.5" text-anchor="middle">Docker</text>
</svg>
