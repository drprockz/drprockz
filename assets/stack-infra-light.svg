<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 174" width="410" height="174" font-size="12" role="img" aria-labelledby="t d">
<title id="t">STACK / INFRA + QUALITY</title><desc id="d">AWS, Docker, Nginx, GitHub Actions, Cloudflare Tunnel, PM2, Playwright, pytest, vitest, Lighthouse</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;fill:#15181D}
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
